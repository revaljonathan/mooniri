# Stone — a monochrome colorscheme with desaturated accents
# Place in ~/.config/kitty/ and add `include stone.conf` to kitty.conf

# Background / Foreground
background             #121213
foreground             #d4d0c8
selection_background   #3a3a3b
selection_foreground   #d4d0c8

# Cursor
cursor                 #d4d0c8
cursor_text_color      #121213

# URL underline color
url_color              #6fa3c2

# Window border colors
active_border_color    #3a3a3b
inactive_border_color  #242425
bell_border_color      #c2a46f

# Tab bar
active_tab_background   #242425
active_tab_foreground   #d4d0c8
inactive_tab_background #1a1a1b
inactive_tab_foreground #7a7875

# Normal colors (black, red, green, yellow, blue, magenta, cyan, white)
color0  #121213
color1  #c27070
color2  #7da87f
color3  #c2a46f
color4  #6fa3c2
color5  #9b8fc7
color6  #a0b870
color7  #d4d0c8

# Bright colors
color8   #3a3a3b
color9   #d08888
color10  #92bc94
color11  #d4b888
color12  #88bcd4
color13  #b0a3d4
color14  #b4c888
color15  #e8e4dc
